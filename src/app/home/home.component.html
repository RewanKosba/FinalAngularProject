<h1>Welcome to our shopping website , start browsing....</h1>
<div class="container-products">
  <!-- <button (click)="nextPAge()">Next</button>
  <button (click)="prevPage()">Last</button> -->
  @for(item of products ; track item.id){
    <a style="text-decoration: none;" [routerLink]='["/MovieDetails", item.id]'>
      <div class="card" style="width: 18rem;">
        <div class="img-container">
          <span *ngIf="item.stock > 0" class="badge badge-success">in stock</span>
          <span *ngIf="item.stock === 0" class="badge badge-danger">out of stock</span>
          <img style="width: 180px; height: 180px;" src="{{item.image}}" class="card-img-top" alt="...">
        </div>
        <div class="card-body">
          <div class="first-title d-flex m-2" style="gap: 45px;">
            <h5 class="card-title">{{item.title}}</h5>
            <h5 class="rating">{{item.price | currency}}</h5>
          </div>
          <p class="card-text">{{item.description}}</p>

          <div class="stars">
            <div class="full-stars" [ngStyle]="{'width': (item.rating / 5) * 100 + '%'}">
              <i *ngFor="let star of [1,2,3,4,5]" class="bi bi-star-fill"></i>
            </div>
            <div class="empty-stars">
              <i *ngFor="let star of [1,2,3,4,5]" class="bi bi-star-fill"></i>
            </div>
          </div>

          <a (click)="addToCart(item)" style="display: block;" href="#" class="btn ">Add to cart</a>
        
        </div>
      </div>
    </a>
  }
</div>
